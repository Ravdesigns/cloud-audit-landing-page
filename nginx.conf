server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single static page. Unknown paths fall back to it rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Self-hosted fonts are immutable; the page itself must stay fresh.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
